server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/BankEnterpriseDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root          # Replace with your MySQL username if different
    password: លេេសេានងបោក០០៤  # Replace with your actual MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # Maps your Java classes directly to your DB tables safely
    show-sql: true          # Prints the SQL commands in the IntelliJ console for debugging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect